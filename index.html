<title>GO! Snake</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #b9242b;
    --red-dark: #8f1c22;
    --red-soft: #e9a4a8;
    --ink: #241f1e;
    --bg: #faf7f5;
    --panel: #ffffff;
    --board: #eeeae7;
    --grid-line: rgba(36,31,30,0.05);
    --muted: #7a7371;
    --shadow: rgba(36,31,30,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f4efed;
      --bg: #1b1817;
      --panel: #252120;
      --board: #2c2725;
      --grid-line: rgba(244,239,237,0.06);
      --muted: #a89d99;
      --shadow: rgba(0,0,0,0.4);
      --red: #d84a50;
      --red-dark: #b9242b;
      --red-soft: #6e2a2c;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f4efed;
    --bg: #1b1817;
    --panel: #252120;
    --board: #2c2725;
    --grid-line: rgba(244,239,237,0.06);
    --muted: #a89d99;
    --shadow: rgba(0,0,0,0.4);
    --red: #d84a50;
    --red-dark: #b9242b;
    --red-soft: #6e2a2c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    margin: 0;
  }
  body {
    color: var(--ink);
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 22px 16px 28px;
    gap: 0;
    touch-action: none;
    overscroll-behavior: none;
  }

  .wordmark {
    text-align: center;
    line-height: 0.82;
  }
  .wordmark .go {
    font-weight: 900;
    font-size: clamp(38px, 11vw, 52px);
    color: var(--red);
    letter-spacing: -1px;
  }
  .wordmark .tag {
    display: block;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 2.5px;
    color: var(--muted);
    margin-top: 4px;
  }

  h1 {
    font-weight: 700;
    font-size: clamp(15px, 4vw, 18px);
    color: var(--ink);
    margin: 6px 0 16px;
    text-align: center;
    opacity: 0.85;
  }
  h1 span { color: var(--red); font-weight: 900; }

  #score {
    background: var(--red);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 7px 20px;
    border-radius: 999px;
    margin-bottom: 16px;
    letter-spacing: 0.6px;
    font-variant-numeric: tabular-nums;
  }

  .board-wrap {
    padding: min(2.5vw, 10px);
    background: var(--panel);
    border-radius: 14px;
    box-shadow: 0 10px 30px var(--shadow);
    width: min(400px, 92vw);
  }

  canvas {
    background: var(--board);
    border-radius: 6px;
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  #msg {
    margin-top: 14px;
    min-height: 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--red-dark);
    text-align: center;
    text-wrap: balance;
  }

  button {
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    border: none;
  }

  #restart {
    margin-top: 12px;
    padding: 11px 28px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: #fff;
    background: var(--red);
    border-radius: 8px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #restart:hover { background: var(--red-dark); }
  #restart:active { transform: scale(0.96); }

  .pad {
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 6px;
    margin-top: 22px;
    user-select: none;
  }
  .pad button {
    background: var(--panel);
    color: var(--red);
    border-radius: 12px;
    font-size: 20px;
    box-shadow: 0 3px 10px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease, background 0.1s ease;
  }
  .pad button:active {
    transform: scale(0.9);
    background: var(--red-soft);
  }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .spacer { visibility: hidden; }

  .hint {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  footer {
    margin-top: auto;
    padding-top: 26px;
    font-size: 10.5px;
    color: var(--muted);
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }

  :focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }
</style>

<div class="wordmark">
  <span class="go">GO!</span>
  <span class="tag">EXPRESS &amp; LOGISTICS — STYLE</span>
</div>
<h1>Gra <span>Wąż</span> — ekspresowa dostawa</h1>
<div id="score">WYNIK: 0</div>
<div class="board-wrap">
  <canvas id="game" width="400" height="400"></canvas>
</div>
<div id="msg"></div>
<button id="restart">Nowa gra</button>

<div class="pad" aria-hidden="false">
  <span class="spacer"></span>
  <button class="up" data-dir="up" aria-label="Góra">▲</button>
  <span class="spacer"></span>
  <button class="left" data-dir="left" aria-label="Lewo">◀</button>
  <button class="down" data-dir="down" aria-label="Dół">▼</button>
  <button class="right" data-dir="right" aria-label="Prawo">▶</button>
</div>
<div class="hint">Strzałki / WASD, przyciski powyżej albo przesuń palcem po planszy</div>

<footer>
  Nieoficjalna gra fanowska inspirowana stylem GO! Express &amp; Logistics.<br>
  Projekt niezależny, niezwiązany z General Overnight / GO! Express.
</footer>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const msgEl = document.getElementById('msg');
  const restartBtn = document.getElementById('restart');
  const pad = document.querySelector('.pad');

  const GRID = 20;
  const CELLS = canvas.width / GRID;
  const SPEED_MS = 120;

  function themeColor(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  let snake, dir, nextDir, food, score, running, loopId;

  function randomCell() {
    return {
      x: Math.floor(Math.random() * CELLS),
      y: Math.floor(Math.random() * CELLS),
    };
  }

  function placeFood() {
    let cell;
    do {
      cell = randomCell();
    } while (snake.some(s => s.x === cell.x && s.y === cell.y));
    food = cell;
  }

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    running = true;
    scoreEl.textContent = 'WYNIK: 0';
    msgEl.textContent = '';
    placeFood();
    if (loopId) clearInterval(loopId);
    loopId = setInterval(tick, SPEED_MS);
    draw();
  }

  function setDir(nx, ny) {
    if (nx !== 0 && dir.x === 0) nextDir = { x: nx, y: 0 };
    else if (ny !== 0 && dir.y === 0) nextDir = { x: 0, y: ny };
  }

  function tick() {
    if (!running) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (
      head.x < 0 || head.x >= CELLS ||
      head.y < 0 || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = 'WYNIK: ' + score;
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(loopId);
    msgEl.textContent = 'Koniec gry! Wynik: ' + score + ' — kliknij "Nowa gra"';
  }

  function draw() {
    const board = themeColor('--board');
    const gridLine = themeColor('--grid-line');
    const red = themeColor('--red');
    const redDark = themeColor('--red-dark');
    const ink = themeColor('--ink');

    ctx.fillStyle = board;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = gridLine;
    for (let i = 0; i <= CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID, 0);
      ctx.lineTo(i * GRID, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * GRID);
      ctx.lineTo(canvas.width, i * GRID);
      ctx.stroke();
    }

    ctx.font = (GRID - 2) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('📦', food.x * GRID + GRID / 2, food.y * GRID + GRID / 2 + 1);

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? ink : (i % 2 === 0 ? red : redDark);
      const pad = i === 0 ? 0 : 1;
      ctx.fillRect(s.x * GRID + pad, s.y * GRID + pad, GRID - pad * 2, GRID - pad * 2);
    });

    if (snake.length) {
      const head = snake[0];
      ctx.fillStyle = board;
      const cx = head.x * GRID + GRID / 2;
      const cy = head.y * GRID + GRID / 2;
      const ex = dir.x * 4;
      const ey = dir.y * 4;
      const ox = dir.y !== 0 ? 4 : 0;
      const oy = dir.x !== 0 ? 4 : 0;
      ctx.beginPath();
      ctx.arc(cx + ex + ox, cy + ey + oy, 2, 0, Math.PI * 2);
      ctx.arc(cx + ex - ox, cy + ey - oy, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  window.addEventListener('keydown', e => {
    const key = e.key;
    if (key === 'ArrowUp' || key === 'w') setDir(0, -1);
    else if (key === 'ArrowDown' || key === 's') setDir(0, 1);
    else if (key === 'ArrowLeft' || key === 'a') setDir(-1, 0);
    else if (key === 'ArrowRight' || key === 'd') setDir(1, 0);
    else return;
    e.preventDefault();
  }, { passive: false });

  pad.addEventListener('click', e => {
    const btn = e.target.closest('button[data-dir]');
    if (!btn) return;
    const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const [nx, ny] = map[btn.dataset.dir];
    setDir(nx, ny);
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 20) setDir(dx > 0 ? 1 : -1, 0);
    } else {
      if (Math.abs(dy) > 20) setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, { passive: true });

  restartBtn.addEventListener('click', reset);

  reset();
</script>
